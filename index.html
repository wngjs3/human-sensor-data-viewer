<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S3 Sensor Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --soft: #eef1f5; --line: #dde2e8;
    --text: #1d2330; --muted: #6b7380; --accent: #2f6fde; --accent-soft: #e6eefc;
    --danger: #c43c3c; --danger-soft: #fbeaea;
    --badge-l: 92%; --badge-tl: 30%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --soft: #222833; --line: #2d3440;
      --text: #e4e8ef; --muted: #8d96a5; --accent: #6b9cf0; --accent-soft: #23314a;
      --danger: #e67a7a; --danger-soft: #3a2224;
      --badge-l: 24%; --badge-tl: 82%;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  header { padding: 16px 24px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .loc { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
  main { padding: 0 24px 24px; display: grid; gap: 16px; grid-template-columns: 280px 1fr; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 0 16px 16px; } header { padding: 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  textarea { resize: vertical; font-family: ui-monospace, Menlo, monospace !important; font-size: 11px !important; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; font-size: 13px; }
  input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: var(--soft); color: var(--text); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .check { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin: 10px 0; }
  .msg { margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.err { background: var(--danger-soft); color: var(--danger); }
  .msg.ok { background: var(--accent-soft); color: var(--accent); }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; position: sticky; top: 16px; }
  @media (max-width: 900px) { .side { position: static; } }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  pre { background: var(--soft); border-radius: 8px; padding: 10px; font-size: 11px; overflow: auto; margin: 8px 0 0; }

  /* 폴더 트리 */
  .tree { max-height: 60vh; overflow: auto; margin: 0 -8px; font-size: 13px; }
  @media (max-width: 900px) { .tree { max-height: 30vh; } }
  .tnode { display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .tnode:hover { background: var(--soft); }
  .tnode.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tnode .tw { width: 14px; flex: 0 0 14px; color: var(--muted); text-align: center; font-size: 11px; }
  .tnode .tname { overflow: hidden; text-overflow: ellipsis; }

  /* 툴바 */
  .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .nav { width: 34px; height: 34px; padding: 0; background: var(--soft); color: var(--text); font-weight: 500; flex: 0 0 auto; }
  .nav:hover:not(:disabled) { background: var(--line); }
  .path { display: flex; flex-wrap: wrap; align-items: center; gap: 0; flex: 1; min-width: 0;
    background: var(--soft); border-radius: 8px; padding: 2px 4px; font-size: 13px; min-height: 34px; }
  .path button { background: none; color: var(--accent); padding: 4px 6px; font-weight: 500; border-radius: 6px; }
  .path button:hover { background: var(--line); }
  .path .cur { color: var(--text); font-weight: 600; padding: 4px 6px; }
  .path .sep { color: var(--muted); }
  .seg { display: flex; gap: 2px; background: var(--soft); border-radius: 8px; padding: 2px; flex: 0 0 auto; }
  .seg button { background: transparent; color: var(--muted); padding: 6px 10px; font-size: 12px; font-weight: 500; }
  .seg button.on { background: var(--panel); color: var(--text); }
  .toolbar2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  .toolbar2 .check { margin: 0; }
  .toolbar2 button { padding: 6px 12px; font-size: 12px; }
  .users { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
  .users .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .ufilter { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--soft); color: var(--text); }
  .ufilter.on { background: var(--text); color: var(--panel); }
  .ubadge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap;
    background: hsl(var(--h) 65% var(--badge-l)); color: hsl(var(--h) 60% var(--badge-tl)); vertical-align: 1px; }
  .ufilter .ubadge { margin-right: 2px; }
  .muted { color: var(--muted); }

  /* 목록 */
  .files-wrap { overflow-x: auto; }
  table.files { font-size: 13px; }
  table.files th { position: static; background: none; color: var(--muted); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--line); }
  table.files td { padding: 7px 10px; }
  table.files tbody tr { cursor: pointer; }
  table.files tbody tr:hover { background: var(--soft); }
  table.files .ck { width: 28px; padding-right: 0; }
  table.files .nm { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  table.files .num { text-align: right; color: var(--muted); }
  table.files .dt { color: var(--muted); }

  /* 이미지로 보기 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .tile { position: relative; cursor: pointer; border-radius: 10px; overflow: hidden; background: var(--soft); }
  .tile:hover { outline: 2px solid var(--accent); }
  .tile .pick { position: absolute; top: 8px; left: 8px; z-index: 1; width: 16px; height: 16px; }
  .tile .ubadge { position: absolute; top: 6px; right: 6px; z-index: 1; font-size: 12px; padding: 2px 9px; }
  .thumb { aspect-ratio: 16 / 9; background: #000; display: flex; align-items: center; justify-content: center;
    color: #8d96a5; font-size: 12px; font-weight: 600; }
  .thumb.noimg { background: var(--line); color: var(--muted); }
  .thumb video, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { padding: 6px 8px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap small { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }

  /* 파일 보기 */
  .viewer-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .viewer-head .file { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; flex: 0 1 auto; }
  .viewer-head .meta { color: var(--muted); font-size: 12px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .stat { background: var(--soft); border-radius: 8px; padding: 8px 12px; }
  .stat b { display: block; font-size: 16px; }
  .stat span { font-size: 11px; color: var(--muted); }
  .controls { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 600px) { .controls { grid-template-columns: 1fr; } }
  .ychecks { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; gap: 4px; align-items: center; background: var(--soft); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .chart-wrap { position: relative; height: 340px; margin-bottom: 16px; }
  .table-wrap { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--soft); font-weight: 600; }
  .raw { max-height: 500px; }
  .media { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; display: block; object-fit: contain; }

  /* MCAP */
  .mc-panels { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .mc-panel { background: var(--soft); border-radius: 10px; padding: 8px; min-width: 0; }
  .mc-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .mc-top .mc-panel { display: flex; flex-direction: column; }
  .mc-top .mc-canvas { flex: 1 1 0; height: auto; min-height: 300px; }
  .mc-panel .media { max-height: 50vh; }
  .mc-title { display: block; font: 11px ui-monospace, Menlo, monospace; color: var(--muted); margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc-canvas { width: 100%; height: 220px; display: block; touch-action: none; cursor: grab; }
  .mc-timeline { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center;
    background: var(--panel); padding: 8px 0; margin-bottom: 8px; }
  .mc-play { width: 44px; flex: 0 0 auto; }
  .mc-seek { flex: 1; accent-color: var(--accent); min-width: 0; }
  .mc-time { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); white-space: nowrap; }
  .mc-speed { width: auto; flex: 0 0 auto; }
  .mc-charts { display: flex; flex-direction: column; gap: 14px; }
  .mc-chart-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .mc-chart-head .mc-title { margin: 0; max-width: 100%; }
  .mc-chips { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .mc-chips .chip { font-weight: 600; }
  .mc-add { width: auto; padding: 3px 8px; font-size: 12px; }
  .mc-chart-wrap { position: relative; height: 150px; }
  .mc-cursor { position: absolute; top: 0; bottom: 20px; width: 1.5px; background: var(--danger); pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>S3 Sensor Viewer</h1>
  <span class="loc" id="loc"></span>
  <button class="ghost" id="settingsBtn" style="margin-left:auto" hidden>⚙ 설정</button>
</header>

<main>
  <div class="side">
    <section class="card" id="settings">
      <h2>연결 설정</h2>
      <label>키 붙여넣기 (env / ~/.aws/credentials / STS JSON)</label>
      <textarea id="paste" rows="3" spellcheck="false" placeholder="export AWS_ACCESS_KEY_ID=...&#10;export AWS_SECRET_ACCESS_KEY=..."></textarea>
      <label>Access Key ID</label>
      <input type="text" id="ak" autocomplete="off" spellcheck="false">
      <label>Secret Access Key</label>
      <input type="password" id="sk" autocomplete="off">
      <label>Session Token (선택)</label>
      <input type="password" id="st" autocomplete="off">
      <div class="row">
        <div><label>Region</label><input type="text" id="region" value="us-west-2"></div>
        <div><label>Bucket</label><input type="text" id="bucket" value="riselab-data-bucket"></div>
      </div>
      <label>Prefix</label>
      <input type="text" id="prefix" value="share/data/human-sensor/raw/">
      <label class="check"><input type="checkbox" id="remember" checked> 이 브라우저에 키 저장</label>
      <div class="row">
        <button id="connect">연결</button>
        <button class="ghost" id="forget" style="flex:0 0 auto">키 지우기</button>
      </div>
      <div id="connMsg"></div>
      <details style="margin-top:12px">
        <summary>CORS 오류가 나면 (버킷 CORS 설정)</summary>
        <pre id="cors"></pre>
      </details>
    </section>

    <section class="card">
      <h2>폴더</h2>
      <div class="tree" id="tree"><div class="empty">연결 전</div></div>
    </section>
  </div>

  <section class="card">
    <div class="toolbar">
      <button class="nav" id="navBack" title="뒤로">←</button>
      <button class="nav" id="navFwd" title="앞으로">→</button>
      <button class="nav" id="navUp" title="상위 폴더">↑</button>
      <div class="path" id="path"></div>
      <button class="nav" id="refresh" title="새로고침">⟳</button>
      <div class="seg" id="viewSeg"><button data-v="list">목록</button><button data-v="grid">이미지로 보기</button></div>
    </div>
    <div class="toolbar2" id="toolbar2">
      <div class="users" id="users"></div>
      <label class="check"><input type="checkbox" id="selAll"> 전체 선택</label>
      <button class="ghost" id="dlBtn" disabled>선택 다운로드</button>
    </div>
    <div id="content"><div class="empty">연결 설정에서 키를 입력하세요</div></div>
  </section>
</main>

<script type="module">
import { AwsClient } from 'https://cdn.jsdelivr.net/npm/aws4fetch@1.0.20/dist/aws4fetch.esm.mjs';
import { firstFrame, sessionMeta } from './mcap.js';
import { renderMcap } from './mcap-view.js';

const $ = id => document.getElementById(id);
const STORE = 's3viewer.v1';
const MAX_ROWS_TABLE = 200, MAX_POINTS = 4000, MAX_BYTES = 50 * 1024 * 1024;

const VIDEO = /\.(mp4|webm|mov|m4v|mkv|ogv)$/i, IMAGE = /\.(jpe?g|png|gif|webp|bmp|svg)$/i;
const MCAP = /\.mcap$/i, MAX_MCAP = 1024 ** 3;
// 폴더 이름으로 사용자 구분 (user1, user_02, subject3, P04 …)
const USER_RE = /^(user|유저|subject|sub|participant|p|u)[-_ ]?\d+$/i;
const isMedia = key => VIDEO.test(key) || IMAGE.test(key);

let client = null, cfg = null, curPrefix = '', nextToken = null, chart = null, listed = false;
let listing = { dirs: [], files: [] };
let cleanup = null, openToken = 0, openedFile = null, userFilter = null;
const picked = new Set();
const tree = new Map();      // prefix → { open, children }
const metaCache = new Map(); // key → Promise<session meta | null>
const metaDone = new Map();  // key → session meta | null
let view = 'list';
try { view = localStorage.getItem('s3viewer.view') || 'list'; } catch {}

// --- settings ---
let saved = null;
try {
  saved = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (saved) for (const k of ['ak', 'sk', 'st', 'region', 'bucket', 'prefix']) if (saved[k] != null) $(k).value = saved[k];
} catch {}

$('cors').textContent = JSON.stringify([{
  AllowedHeaders: ['*'], AllowedMethods: ['GET', 'HEAD'],
  AllowedOrigins: [location.origin.startsWith('http') ? location.origin : '*'],
  ExposeHeaders: ['x-amz-bucket-region'],
}], null, 2);

// env 변수, ~/.aws/credentials, `aws sts` JSON 출력 어느 형식이든 붙여넣으면 채움
const PASTE_RULES = {
  ak: /(?:aws_access_key_id|AccessKeyId)["']?\s*[:=]\s*["']?([A-Z0-9]{16,})/i,
  sk: /(?:aws_secret_access_key|SecretAccessKey)["']?\s*[:=]\s*["']?([^\s"',]+)/i,
  st: /(?:aws_session_token|SessionToken)["']?\s*[:=]\s*["']?([^\s"',]+)/i,
  region: /(?:aws_default_region|aws_region|^\s*region)["']?\s*[:=]\s*["']?([a-z]{2}-[a-z]+-\d)/im,
};
$('paste').oninput = () => {
  const text = $('paste').value;
  const found = Object.entries(PASTE_RULES).filter(([k, re]) => {
    const m = text.match(re);
    if (m) $(k).value = m[1];
    return m;
  }).map(([k]) => k);
  if (found.length) {
    $('paste').value = '';
    showMsg('connMsg', `붙여넣기에서 ${found.join(', ')} 채움`, 'ok');
  }
};

$('forget').onclick = () => {
  try { localStorage.removeItem(STORE); } catch {}
  $('ak').value = $('sk').value = $('st').value = '';
  $('remember').checked = false;
  showMsg('connMsg', '저장된 키를 지웠습니다', 'ok');
};

$('connect').onclick = async () => {
  // 키에는 공백이 없으므로 복사 중 섞인 공백·줄바꿈·보이지 않는 문자 제거
  const clean = id => $(id).value.replace(/[\s​-‍﻿]/g, '');
  cfg = {
    ak: clean('ak'), sk: clean('sk'), st: clean('st'),
    region: $('region').value.trim(), bucket: $('bucket').value.trim(),
    prefix: $('prefix').value.trim().replace(/^\/+/, ''),
  };
  if (!cfg.ak || !cfg.sk) return showMsg('connMsg', 'Access Key와 Secret Key를 입력하세요', 'err');
  if (cfg.prefix && !cfg.prefix.endsWith('/')) cfg.prefix += '/';
  try {
    if ($('remember').checked) localStorage.setItem(STORE, JSON.stringify(cfg));
    else localStorage.removeItem(STORE);
  } catch {}
  client = new AwsClient({
    accessKeyId: cfg.ak, secretAccessKey: cfg.sk, sessionToken: cfg.st || undefined,
    service: 's3', region: cfg.region,
  });
  showMsg('connMsg', '');
  tree.clear(); listed = false;
  if (await route()) showSettings(false);
};

// 연결된 뒤에는 설정 카드를 숨기고 ⚙ 버튼으로만 열기
function showSettings(show) {
  $('settings').hidden = !show;
  $('settingsBtn').hidden = !client;
  $('settingsBtn').textContent = show ? '설정 닫기' : '⚙ 설정';
}
$('settingsBtn').onclick = () => showSettings($('settings').hidden);

// --- S3 ---
const baseUrl = () => `https://${cfg.bucket}.s3.${cfg.region}.amazonaws.com`;
const encKey = key => key.split('/').map(encodeURIComponent).join('/');

async function s3(url, init) {
  let res;
  try { res = await client.fetch(url, init); }
  catch (e) { throw new Error(`요청 실패 (CORS 또는 네트워크 문제일 수 있어요)\n${e.message}`); }
  if (!res.ok) {
    const body = await res.text();
    const code = body.match(/<Code>(.*?)<\/Code>/)?.[1] || res.status;
    const msg = body.match(/<Message>(.*?)<\/Message>/)?.[1] || res.statusText;
    const hint = {
      SignatureDoesNotMatch: 'Secret Access Key가 Access Key ID와 맞지 않아요. Secret Key를 다시 복사해서 붙여넣어 보세요.',
      InvalidAccessKeyId: 'Access Key ID가 없거나 비활성화된 키예요.',
      AccessDenied: '이 키에 이 버킷/경로를 읽을 권한이 없어요 (s3:ListBucket, s3:GetObject 필요).',
      ExpiredToken: 'Session Token이 만료됐어요. 새로 발급받아 넣어주세요.',
      RequestTimeTooSkewed: '컴퓨터 시계가 많이 틀려요. 시간 자동 설정을 켜주세요.',
    }[code];
    throw new Error(`${hint ? `${hint}\n` : ''}(${code}: ${msg})`);
  }
  return res;
}

async function listXml(qs) {
  const text = await (await s3(`${baseUrl()}/?${qs}`)).text();
  return new DOMParser().parseFromString(text, 'application/xml');
}

// 서명된 GET URL — <video>/<img>가 헤더 없이 직접 스트리밍, downloadName이면 첨부파일로
async function presign(key, downloadName) {
  const qs = downloadName
    ? `?response-content-disposition=${encodeURIComponent(`attachment; filename*=UTF-8''${encodeURIComponent(downloadName)}`)}` : '';
  return (await client.sign(`${baseUrl()}/${encKey(key)}${qs}`, { aws: { signQuery: true } })).url;
}

async function listAll(prefix) {
  const keys = [];
  let token = null;
  do {
    const qs = new URLSearchParams({ 'list-type': '2', prefix });
    if (token) qs.set('continuation-token', token);
    const xml = await listXml(qs);
    keys.push(...[...xml.querySelectorAll('Contents > Key')].map(n => n.textContent).filter(k => !k.endsWith('/')));
    token = xml.querySelector('IsTruncated')?.textContent === 'true' ? xml.querySelector('NextContinuationToken')?.textContent : null;
  } while (token);
  return keys;
}

async function readAll(res, total, onProgress) {
  const reader = res.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    onProgress(total ? got / total : 0);
  }
  const out = new Uint8Array(got);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}

// 동시 요청 수 제한
const limit = (() => {
  let active = 0;
  const q = [];
  const next = () => {
    if (active >= 6 || !q.length) return;
    active++;
    const [fn, ok, fail] = q.shift();
    fn().then(ok, fail).finally(() => { active--; next(); });
  };
  return fn => new Promise((ok, fail) => { q.push([fn, ok, fail]); next(); });
})();

const rangeGet = async (key, bytes) =>
  new Uint8Array(await (await s3(`${baseUrl()}/${encKey(key)}`, { headers: { Range: `bytes=0-${bytes - 1}` } })).arrayBuffer());

// 썸네일/대표 파일 결과 캐시 (필터·보기 전환 때 다시 받지 않게)
const memo = new Map();
const cached = (k, fn) => { if (!memo.has(k)) memo.set(k, fn().catch(() => null)); return memo.get(k); };

// MCAP 앞부분만 받아서 첫 장면 찾기 (1MB → 3MB → 8MB)
const mcapThumb = key => cached('thumb:' + key, () => mcapThumbLoad(key));
async function mcapThumbLoad(key) {
  for (const mb of [1, 3, 8]) {
    const want = mb * 1024 * 1024, u8 = await limit(() => rangeGet(key, want));
    if (!metaDone.has(key)) setMeta(key, sessionMeta(u8));
    const found = firstFrame(u8);
    if (found || u8.length < want) return found;
  }
  return null;
}

// --- 사용자 / 작업 ---
const rel = p => p.slice(cfg.prefix.length);
const userOfPath = p => rel(p).split('/').find(s => USER_RE.test(s)) || '';
const userOf = key => key.endsWith('/') ? userOfPath(key) : (metaDone.get(key)?.user_id || userOfPath(key));
const taskOf = key => metaDone.get(key)?.task || key.match(/Z_([^/]+)\.mcap$/i)?.[1] || '';

function userBadge(u) {
  if (!u) return '';
  // 이름 해시 → 황금각으로 흩어서 user1/user2처럼 비슷한 이름도 색이 확 다르게
  let h = 2166136261;
  for (const c of u) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return `<span class="ubadge" style="--h:${Math.round(((h >>> 0) * 137.508) % 360)}">${esc(u)}</span>`;
}

function setMeta(key, m) {
  metaDone.set(key, m);
  if (!metaCache.has(key)) metaCache.set(key, Promise.resolve(m));
  document.querySelectorAll(`[data-mk="${CSS.escape(key)}"]`).forEach(el => {
    if (el.dataset.f === 'user') el.innerHTML = userBadge(userOf(key)) || '<span class="muted">—</span>';
    if (el.dataset.f === 'task') el.textContent = taskOf(key);
    if (el.dataset.f === 'badge') el.innerHTML = userBadge(userOf(key));
  });
  scheduleUsers();
}

// MCAP 맨 앞 16KB만 읽어 session 메타데이터(user_id, task)
function loadMeta(key) {
  if (!metaCache.has(key)) {
    metaCache.set(key, limit(() => rangeGet(key, 16384)).then(sessionMeta).catch(() => null)
      .then(m => { if (!metaDone.has(key)) setMeta(key, m); return m; }));
  }
  return metaCache.get(key);
}

let usersTimer = 0;
const scheduleUsers = () => { clearTimeout(usersTimer); usersTimer = setTimeout(renderUsers, 50); };

function items() {
  const all = [...listing.dirs.map(k => ({ key: k, dir: true })), ...listing.files];
  if (userFilter == null) return all;
  return all.filter(it => {
    const u = userOf(it.key);
    if (it.dir && !u) return true; // 사용자 표시 없는 폴더는 항상 보임
    return userFilter === '' ? !u : u === userFilter;
  });
}

function renderUsers() {
  const counts = new Map();
  let none = 0;
  for (const it of [...listing.dirs.map(k => ({ key: k, dir: true })), ...listing.files]) {
    const u = userOf(it.key);
    if (u) counts.set(u, (counts.get(u) || 0) + 1);
    else if (!it.dir) none++;
  }
  if (!counts.size) { $('users').innerHTML = ''; return; }
  const btn = (val, label, n) => `<button class="ufilter ${userFilter === val ? 'on' : ''}" data-u="${val == null ? '*' : esc(val)}">${label} <span class="muted">${n}</span></button>`;
  $('users').innerHTML = '<span class="lbl">사용자</span>'
    + btn(null, '전체', listing.dirs.length + listing.files.length)
    + [...counts].sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true })).map(([u, n]) => btn(u, userBadge(u), n)).join('')
    + (none ? btn('', '미지정', none) : '');
  $('users').querySelectorAll('.ufilter').forEach(b => b.onclick = () => {
    userFilter = b.dataset.u === '*' ? null : b.dataset.u;
    renderUsers();
    renderContent();
  });
}

// --- 이동 (URL #/경로 = 현재 위치 → 브라우저 뒤로/앞으로, 링크 공유) ---
function go(path) {
  const h = '#/' + encodeURI(rel(path));
  if (location.hash === h) route(); else location.hash = h;
}
window.addEventListener('hashchange', () => { if (client) route(); });
$('navBack').onclick = () => history.back();
$('navFwd').onclick = () => history.forward();
$('navUp').onclick = () => {
  if (openedFile) return go(curPrefix);
  const r = rel(curPrefix).split('/').filter(Boolean);
  go(cfg.prefix + (r.length > 1 ? r.slice(0, -1).join('/') + '/' : ''));
};
$('refresh').onclick = () => { listed = false; memo.clear(); route(); };

async function route() {
  let r = '';
  try { r = decodeURI(location.hash.replace(/^#\/?/, '')); } catch {}
  const path = cfg.prefix + r;
  if (!r || path.endsWith('/')) {
    openedFile = null;
    if (path !== curPrefix || !listed) return openPrefix(path);
    renderContent();
    return true;
  }
  const parent = path.slice(0, path.lastIndexOf('/') + 1);
  if (parent !== curPrefix || !listed) if (!await openPrefix(parent, false, true)) return false;
  openFile(listing.files.find(x => x.key === path) || { key: path, size: 0, modified: '' });
  return true;
}

async function openPrefix(prefix, append = false, quiet = false) {
  if (!append) {
    curPrefix = prefix; nextToken = null; userFilter = null; picked.clear(); listed = false;
    if (!quiet) { openedFile = null; setContent('<div class="empty">불러오는 중…</div>'); }
    renderPath();
  }
  const qs = new URLSearchParams({ 'list-type': '2', prefix, delimiter: '/', 'max-keys': '500' });
  if (append && nextToken) qs.set('continuation-token', nextToken);
  try {
    const xml = await listXml(qs);
    const dirs = [...xml.querySelectorAll('CommonPrefixes > Prefix')].map(n => n.textContent);
    const files = [...xml.querySelectorAll('Contents')].map(n => ({
      key: n.querySelector('Key').textContent,
      size: +n.querySelector('Size').textContent,
      modified: n.querySelector('LastModified').textContent,
    })).filter(f => f.key !== prefix);
    nextToken = xml.querySelector('IsTruncated')?.textContent === 'true'
      ? xml.querySelector('NextContinuationToken')?.textContent : null;
    if (append) { listing.dirs.push(...dirs); listing.files.push(...files); }
    else listing = { dirs, files };
    listed = true;
    files.filter(f => MCAP.test(f.key)).forEach(f => loadMeta(f.key));
    await syncTree(prefix, append ? null : dirs);
    renderUsers();
    if (!quiet) renderContent();
    showMsg('connMsg', '연결됨', 'ok');
    return true;
  } catch (e) {
    setContent(`<div class="msg err">${esc(e.message)}</div>`);
    showMsg('connMsg', e.message, 'err');
    showSettings(true);
    return false;
  }
}

function renderPath() {
  $('loc').textContent = `s3://${cfg.bucket}/${curPrefix}${openedFile ? openedFile.key.slice(curPrefix.length) : ''}`;
  const segs = rel(curPrefix).split('/').filter(Boolean);
  const rootName = cfg.prefix.split('/').filter(Boolean).pop() || cfg.bucket;
  const parts = [{ name: `🏠 ${rootName}`, p: cfg.prefix }];
  segs.forEach((s, i) => parts.push({ name: s, p: cfg.prefix + segs.slice(0, i + 1).join('/') + '/' }));
  const last = openedFile ? null : parts.pop();
  $('path').innerHTML = parts.map(x => `<button data-p="${esc(x.p)}">${esc(x.name)}</button><span class="sep">/</span>`).join('')
    + (last ? `<span class="cur">${esc(last.name)}</span>` : `<span class="cur">${esc(openedFile.key.split('/').pop())}</span>`);
  $('path').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.p));
  $('navUp').disabled = !openedFile && curPrefix === cfg.prefix;
  $('toolbar2').hidden = !!openedFile;
}

// --- 폴더 트리 ---
async function treeKids(p) {
  if (!tree.has(p)) tree.set(p, { open: false, children: null });
  const n = tree.get(p);
  if (!n.children) {
    const xml = await listXml(new URLSearchParams({ 'list-type': '2', prefix: p, delimiter: '/', 'max-keys': '1000' }));
    n.children = [...xml.querySelectorAll('CommonPrefixes > Prefix')].map(x => x.textContent);
  }
  return n;
}

// 현재 폴더까지 펼치고 그 하위 폴더 목록 갱신
async function syncTree(prefix, dirs) {
  const segs = rel(prefix).split('/').filter(Boolean);
  for (let i = 0; i < segs.length; i++) {
    const a = cfg.prefix + segs.slice(0, i).join('/') + (i ? '/' : '');
    try { (await treeKids(a)).open = true; } catch {}
  }
  if (dirs) tree.set(prefix, { open: true, children: dirs });
  renderTree();
}

function renderTree() {
  const out = [];
  const walk = (p, depth) => {
    const n = tree.get(p);
    const name = p === cfg.prefix ? `🏠 ${cfg.prefix.split('/').filter(Boolean).pop() || cfg.bucket}` : `📁 ${p.slice(0, -1).split('/').pop()}`;
    const leaf = n?.children && !n.children.length;
    out.push(`<div class="tnode ${p === curPrefix ? 'cur' : ''}" data-p="${esc(p)}" style="padding-left:${8 + depth * 14}px">
      <span class="tw">${leaf ? '' : n?.open ? '▾' : '▸'}</span><span class="tname">${esc(name)}</span>${userBadge(userOfPath(p))}</div>`);
    if (n?.open && n.children) n.children.forEach(c => walk(c, depth + 1));
  };
  walk(cfg.prefix, 0);
  $('tree').innerHTML = out.join('');
  $('tree').querySelectorAll('.tnode').forEach(el => el.onclick = async e => {
    const p = el.dataset.p;
    if (e.target.classList.contains('tw')) {
      try { const n = await treeKids(p); n.open = !n.open; } catch {}
      renderTree();
    } else go(p);
  });
  $('tree').querySelector('.cur')?.scrollIntoView({ block: 'nearest' });
}

// --- 보기 전환 ---
function setView(v) {
  view = v;
  try { localStorage.setItem('s3viewer.view', v); } catch {}
  $('viewSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (!client || !listed) return;
  if (openedFile) go(curPrefix); else renderContent();
}
$('viewSeg').querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));
setView(view);

function setContent(html) {
  cleanup?.();
  cleanup = null;
  $('content').innerHTML = html;
  if ($('back')) $('back').onclick = () => go(curPrefix);
}

function renderContent() {
  openedFile = null;
  renderPath();
  const list = items();
  if (!list.length) setContent(`<div class="empty">${listing.dirs.length + listing.files.length ? '이 사용자의 항목이 없어요' : '비어 있음'}</div>`);
  else if (view === 'grid') renderGrid(list);
  else renderTable(list);
  if (nextToken) {
    const more = div('', '<button class="ghost" style="width:100%;margin-top:12px">더 보기</button>');
    more.firstChild.onclick = () => openPrefix(curPrefix, true);
    $('content').append(more);
  }
  hookPicks();
}

const fileIcon = k => VIDEO.test(k) ? '🎬' : IMAGE.test(k) ? '🖼' : MCAP.test(k) ? '📊' : '📄';
const pickBox = k => `<input type="checkbox" class="pick" data-k="${esc(k)}" ${picked.has(k) ? 'checked' : ''}>`;
const fmtDate = s => s ? s.replace('T', ' ').slice(0, 16) : '';

function renderTable(list) {
  const name = k => k.slice(curPrefix.length);
  const userCell = k => `<td data-mk="${esc(k)}" data-f="user">${userBadge(userOf(k)) || (MCAP.test(k) && !metaDone.has(k) ? '<span class="muted">…</span>' : '<span class="muted">—</span>')}</td>`;
  setContent(`<div class="files-wrap"><table class="files">
    <thead><tr><th class="ck"></th><th>이름</th><th>사용자</th><th>작업</th><th class="num">크기</th><th>수정일</th></tr></thead>
    <tbody>${list.map(it => it.dir
      ? `<tr data-open="${esc(it.key)}"><td class="ck">${pickBox(it.key)}</td><td class="nm">📁 ${esc(name(it.key))}</td>${userCell(it.key)}<td></td><td class="num">—</td><td></td></tr>`
      : `<tr data-open="${esc(it.key)}"><td class="ck">${pickBox(it.key)}</td><td class="nm" title="${esc(name(it.key))}">${fileIcon(it.key)} ${esc(name(it.key))}</td>
          ${userCell(it.key)}<td data-mk="${esc(it.key)}" data-f="task">${esc(taskOf(it.key))}</td>
          <td class="num">${fmtSize(it.size)}</td><td class="dt">${fmtDate(it.modified)}</td></tr>`).join('')}
    </tbody></table></div>`);
  $('content').querySelectorAll('tr[data-open]').forEach(tr => tr.onclick = () => go(tr.dataset.open));
}

// --- 이미지로 보기: 영상 첫 프레임 / 이미지 / MCAP 첫 장면 ---
function renderGrid(list) {
  setContent('<div class="grid" id="grid"></div>');
  const grid = $('grid');
  // 화면에 보이는 타일만 불러옴
  const io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); e.target.load(); }
  }), { rootMargin: '200px' });
  for (const it of list) {
    const n = it.key.slice(curPrefix.length);
    const sub = it.dir ? '폴더' : [taskOf(it.key), fmtSize(it.size), fmtDate(it.modified).slice(0, 10)].filter(Boolean).join(' · ');
    const t = div('tile', `${pickBox(it.key)}<span data-mk="${esc(it.key)}" data-f="badge">${userBadge(userOf(it.key))}</span>
      <div class="thumb">…</div>
      <div class="cap" title="${esc(n)}">${it.dir ? '📁 ' : ''}${esc(n)}<small>${esc(sub)}</small></div>`);
    t.onclick = () => go(it.key);
    t.load = it.dir ? async () => fillThumb(t, await firstMedia(it.key)) : () => fillThumb(t, it.key);
    grid.append(t);
    io.observe(t);
  }
}

// 폴더 안 첫 영상(없으면 MCAP, 이미지)을 대표 장면으로
const firstMedia = prefix => cached('first:' + prefix, async () => {
  const xml = await listXml(new URLSearchParams({ 'list-type': '2', prefix, 'max-keys': '1000' }));
  const keys = [...xml.querySelectorAll('Contents > Key')].map(n => n.textContent);
  return keys.find(k => VIDEO.test(k)) || keys.find(k => MCAP.test(k)) || keys.find(k => IMAGE.test(k)) || null;
});

async function fillThumb(t, key) {
  const th = t.querySelector('.thumb');
  if (key && MCAP.test(key)) {
    const found = await mcapThumb(key).catch(() => null);
    if (!found) { th.classList.add('noimg'); th.textContent = 'MCAP'; return; }
    const el = document.createElement(found.kind === 'video' ? 'video' : 'img');
    if (found.kind === 'video') Object.assign(el, { muted: true, playsInline: true, preload: 'auto' });
    el.src = found.url;
    th.textContent = '';
    th.append(el);
    return;
  }
  if (!key || !isMedia(key)) {
    th.classList.add('noimg');
    th.textContent = key ? key.split('.').pop().toUpperCase() : '미리보기 없음';
    return;
  }
  const url = await presign(key);
  th.textContent = '';
  if (IMAGE.test(key)) {
    const img = document.createElement('img');
    img.src = url;
    th.append(img);
    return;
  }
  const vid = document.createElement('video');
  Object.assign(vid, { muted: true, playsInline: true, preload: 'metadata', loop: true });
  vid.src = url + '#t=0.1';
  vid.onerror = () => { th.classList.add('noimg'); th.textContent = '재생 불가'; };
  th.append(vid);
  // 마우스 올리면 미리 재생
  t.onmouseenter = () => vid.play().catch(() => {});
  t.onmouseleave = () => { vid.pause(); vid.currentTime = 0.1; };
}

// --- 선택 다운로드 ---
function hookPicks() {
  $('content').querySelectorAll('input.pick').forEach(cb => {
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => { cb.checked ? picked.add(cb.dataset.k) : picked.delete(cb.dataset.k); updateSel(); };
  });
  updateSel();
}

function updateSel() {
  const boxes = [...$('content').querySelectorAll('input.pick')];
  $('selAll').checked = boxes.length > 0 && boxes.every(b => b.checked);
  $('dlBtn').disabled = !picked.size;
  $('dlBtn').textContent = picked.size ? `선택 다운로드 (${picked.size})` : '선택 다운로드';
}

$('selAll').onchange = e => {
  $('content').querySelectorAll('input.pick').forEach(b => { b.checked = e.target.checked; e.target.checked ? picked.add(b.dataset.k) : picked.delete(b.dataset.k); });
  updateSel();
};

$('dlBtn').onclick = async () => {
  const btn = $('dlBtn');
  btn.disabled = true;
  try {
    const keys = [];
    for (const k of picked) k.endsWith('/') ? keys.push(...await listAll(k)) : keys.push(k);
    if (keys.length > 10 && !confirm(`${keys.length}개 파일을 다운로드할까요?\n브라우저가 '여러 파일 다운로드'를 물어보면 허용해 주세요.`)) return;
    for (let i = 0; i < keys.length; i++) {
      btn.textContent = `다운로드 중 ${i + 1}/${keys.length}`;
      const name = keys[i].slice(curPrefix.length).replaceAll('/', '__');
      const a = document.createElement('a');
      a.href = await presign(keys[i], name);
      a.download = name;
      document.body.append(a); a.click(); a.remove();
      await new Promise(r => setTimeout(r, 700));
    }
  } catch (e) {
    alert(e.message);
  } finally {
    updateSel();
  }
};

// --- 파일 보기 ---
function fileHead(f) {
  return `<div class="viewer-head">
    <span class="row" style="flex:1;min-width:0;flex-wrap:wrap">
      <button class="ghost" id="back" style="flex:0 0 auto">← 폴더로</button>
      <span class="file">${esc(f.key.split('/').pop())}</span>
      <span data-mk="${esc(f.key)}" data-f="badge" style="flex:0 0 auto">${userBadge(userOf(f.key))}</span></span>
    <span class="meta">${f.size ? fmtSize(f.size) + ' · ' : ''}${fmtDate(f.modified)}</span></div>`;
}

async function openFile(f) {
  openedFile = f;
  renderPath();
  if (MCAP.test(f.key)) loadMeta(f.key);
  const token = ++openToken;
  if (MCAP.test(f.key)) {
    if (f.size > MAX_MCAP && !confirm(`${fmtSize(f.size)} 파일입니다. 그래도 불러올까요?`)) return go(curPrefix);
    setContent(fileHead(f) + '<div class="empty" id="mcLoad">불러오는 중…</div>');
    try {
      const res = await s3(`${baseUrl()}/${encKey(f.key)}`);
      const total = f.size || +res.headers.get('content-length') || 0;
      const u8 = await readAll(res, total, p => {
        if (token === openToken && $('mcLoad')) $('mcLoad').textContent = `불러오는 중… ${Math.round(p * 100)}% / ${fmtSize(total)}`;
      });
      if (token !== openToken) return;
      $('mcLoad').textContent = '해석 중…';
      await new Promise(r => setTimeout(r, 30));
      const box = document.createElement('div');
      $('mcLoad').replaceWith(box);
      cleanup = renderMcap(box, u8);
    } catch (e) {
      if (token === openToken) setContent(fileHead(f) + `<div class="msg err">${esc(e.message)}</div>`);
    }
    return;
  }
  if (isMedia(f.key)) {
    const isVideo = VIDEO.test(f.key);
    setContent(fileHead(f) + `<${isVideo ? 'video controls playsinline' : 'img'} class="media"></${isVideo ? 'video' : 'img'}>`);
    const el = $('content').querySelector('.media');
    el.onerror = () => el.replaceWith(div('msg err',
      isVideo ? '브라우저에서 재생할 수 없는 형식이거나(코덱) 권한/CORS 문제입니다' : '이미지를 불러오지 못했습니다'));
    el.src = await presign(f.key);
    return;
  }
  if (f.size > MAX_BYTES && !confirm(`${fmtSize(f.size)} 파일입니다. 그래도 불러올까요?`)) return go(curPrefix);
  setContent(fileHead(f) + `<div class="empty">불러오는 중… ${f.size ? `(${fmtSize(f.size)})` : ''}</div>`);
  try {
    const res = await s3(`${baseUrl()}/${encKey(f.key)}`);
    let name = f.key.toLowerCase();
    let text;
    if (name.endsWith('.gz')) {
      text = await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).text();
      name = name.slice(0, -3);
    } else text = await res.text();
    if (token !== openToken) return;
    renderFile(f, parse(name, text), text);
  } catch (e) {
    if (token === openToken) setContent(fileHead(f) + `<div class="msg err">${esc(e.message)}</div>`);
  }
}

function parse(name, text) {
  const ext = name.split('.').pop();
  try {
    if (ext === 'csv' || ext === 'tsv' || ext === 'txt') {
      const sep = ext === 'tsv' || (!text.split('\n')[0].includes(',') && text.split('\n')[0].includes('\t')) ? '\t' : ',';
      return csvToRows(text, sep);
    }
    if (ext === 'jsonl' || ext === 'ndjson') {
      return text.split('\n').filter(l => l.trim()).map(l => flatten(JSON.parse(l)));
    }
    if (ext === 'json') {
      const j = JSON.parse(text);
      const arr = Array.isArray(j) ? j : Object.values(j).find(Array.isArray);
      return arr ? arr.map(flatten) : [flatten(j)];
    }
  } catch { return null; }
  return null;
}

function csvToRows(text, sep) {
  const out = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === sep) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') out.push(row);
      row = [];
    } else field += c;
  }
  if (field || row.length) { row.push(field); out.push(row); }
  if (!out.length) return [];
  const head = out.shift().map((h, i) => h.trim() || `col${i}`);
  return out.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ''])));
}

function flatten(obj, pre = '', out = {}) {
  if (obj === null || typeof obj !== 'object') { out[pre || 'value'] = obj; return out; }
  for (const [k, v] of Object.entries(obj)) {
    const key = pre ? `${pre}.${k}` : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) flatten(v, key, out);
    else out[key] = Array.isArray(v) ? JSON.stringify(v) : v;
  }
  return out;
}

function renderFile(f, rows, text) {
  const head = fileHead(f);

  if (!rows || !rows.length) {
    setContent(head + `<pre class="raw">${esc(text.slice(0, 20000))}${text.length > 20000 ? '\n…' : ''}</pre>`);
    return;
  }

  const cols = Object.keys(rows[0]);
  const numeric = cols.filter(c => {
    const vals = rows.slice(0, 200).map(r => r[c]).filter(x => x !== '' && x != null);
    return vals.length && vals.filter(x => isFinite(+x)).length / vals.length > 0.9;
  });
  const xDefault = cols.find(c => /time|date|ts|stamp/i.test(c)) || '(행 번호)';
  const yDefault = numeric.filter(c => c !== xDefault).slice(0, 3);

  setContent(head + `
    <div class="stats">
      <div class="stat"><b>${rows.length.toLocaleString()}</b><span>행</span></div>
      <div class="stat"><b>${cols.length}</b><span>컬럼</span></div>
      <div class="stat"><b>${numeric.length}</b><span>숫자 컬럼</span></div>
    </div>
    ${numeric.length ? `
    <div class="controls">
      <div><label>X축</label><select id="xSel">
        <option>(행 번호)</option>${cols.map(c => `<option ${c === xDefault ? 'selected' : ''}>${esc(c)}</option>`).join('')}
      </select></div>
      <div><label>Y축</label><div class="ychecks" id="ySel">
        ${numeric.map(c => `<label class="chip"><input type="checkbox" value="${esc(c)}" ${yDefault.includes(c) ? 'checked' : ''}>${esc(c)}</label>`).join('')}
      </div></div>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>` : ''}
    <div class="table-wrap"><table>
      <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, MAX_ROWS_TABLE).map(r => `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${rows.length > MAX_ROWS_TABLE ? `<div style="color:var(--muted);font-size:12px;margin-top:6px">표는 처음 ${MAX_ROWS_TABLE}행만 표시</div>` : ''}`);

  if (numeric.length) {
    const draw = () => drawChart(rows, $('xSel').value, [...$('ySel').querySelectorAll('input:checked')].map(i => i.value));
    $('xSel').onchange = draw;
    $('ySel').onchange = draw;
    draw();
    cleanup = () => { chart?.destroy(); chart = null; };
  }
}

function drawChart(rows, x, ys) {
  if (chart) chart.destroy();
  const step = Math.max(1, Math.ceil(rows.length / MAX_POINTS));
  const sample = rows.filter((_, i) => i % step === 0);
  const palette = ['#2f6fde', '#e0763a', '#2fa36b', '#c2459a', '#8a63d2', '#c9a227', '#1f9bb3', '#d0463f'];
  const css = getComputedStyle(document.documentElement);
  const grid = css.getPropertyValue('--line').trim(), muted = css.getPropertyValue('--muted').trim();
  chart = new Chart($('chart'), {
    type: 'line',
    data: {
      labels: sample.map((r, i) => x === '(행 번호)' ? i * step : r[x]),
      datasets: ys.map((y, i) => ({
        label: y, data: sample.map(r => r[y] === '' ? null : +r[y]),
        borderColor: palette[i % palette.length], backgroundColor: palette[i % palette.length],
        borderWidth: 1.5, pointRadius: 0, tension: 0,
      })),
    },
    options: {
      animation: false, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      scales: {
        x: { ticks: { color: muted, maxTicksLimit: 6, maxRotation: 0 }, grid: { color: grid } },
        y: { ticks: { color: muted }, grid: { color: grid } },
      },
      plugins: { legend: { labels: { color: muted, boxWidth: 12 } } },
    },
  });
}

// --- utils ---
function div(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function fmtSize(b) { const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return `${b.toFixed(i ? 1 : 0)} ${u[i]}`; }
function showMsg(id, text, kind) { $(id).innerHTML = text ? `<div class="msg ${kind}">${esc(text)}</div>` : ''; }

// 저장된 키가 있으면 설정 화면 없이 바로 연결
if (saved?.ak && saved?.sk) { $('settings').hidden = true; $('connect').click(); }
</script>
